name: startupjigawa

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile.app
  restart: unless-stopped
  environment:
    BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
    NODE_ENV: production
  networks:
    - startup-jigawa-net
  healthcheck:
    test: [ 'CMD-SHELL', 'node -e "require(\"http\").get(\"http://127.0.0.1:$${PORT}\", response => process.exit(response.statusCode < 500 ? 0 : 1)).on(\"error\", () => process.exit(1))"' ]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  jigawa_postgres:
    image: postgres:15
    container_name: jigawa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jigawa
      POSTGRES_PASSWORD: jigawa_pass
      POSTGRES_DB: jigawa_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U jigawa -d jigawa_dev' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - startup-jigawa-net

  jigawa_redis:
    image: redis:7
    container_name: jigawa_redis
    restart: unless-stopped
    command: [ 'redis-server', '--save', '', '--appendonly', 'no' ]
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - startup-jigawa-net

  auth-service:
    image: ${DOCKER_USER:-hhhamza}/auth-service:${TAG:-latest}
    container_name: auth_service
    restart: unless-stopped
    environment:
      PORT: 4000
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      DATABASE_URL: postgresql://jigawa:jigawa_pass@jigawa_postgres:5432/jigawa_dev
      REDIS_URL: redis://jigawa_redis:6379
      JWT_SECRET: changeme
      JWT_REFRESH_SECRET: changeme_refresh
      NODE_ENV: production
    expose:
      - '4000'
    healthcheck:
      test: [ 'CMD-SHELL', 'node -e "require(\"http\").get(\"http://127.0.0.1:4000/health\", response => process.exit(response.statusCode < 500 ? 0 : 1)).on(\"error\", () => process.exit(1))"' ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      jigawa_postgres:
        condition: service_healthy
      jigawa_redis:
        condition: service_healthy
    networks:
      - startup-jigawa-net

  www_service:
    <<: *app-service
    environment:
      APP_KIND: www
      PORT: 3001
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3001']

  academy_service:
    <<: *app-service
    environment:
      APP_KIND: academy
      PORT: 3002
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3002']

  tracker_service:
    <<: *app-service
    environment:
      APP_KIND: tracker
      PORT: 3003
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3003']

  portal_service:
    <<: *app-service
    environment:
      APP_KIND: portal
      PORT: 3004
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3004']

  civic_service:
    <<: *app-service
    environment:
      APP_KIND: civic
      PORT: 3005
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3005']

  labs_service:
    <<: *app-service
    environment:
      APP_KIND: labs
      PORT: 3006
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3006']

  products_service:
    <<: *app-service
    environment:
      APP_KIND: products
      PORT: 3007
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3007']

  cloud_service:
    <<: *app-service
    environment:
      APP_KIND: cloud
      PORT: 3008
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3008']

  admin_service:
    <<: *app-service
    environment:
      APP_KIND: admin
      PORT: 3009
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NODE_ENV: production
    expose: ['3009']

  jigawa_nginx_proxy:
    image: nginx:alpine
    container_name: jigawa_nginx_proxy
    restart: unless-stopped
    ports:
      - '8080:80' # Shifted to 8080 so native host Nginx can use port 80
      - '8443:443' # Shifted to 8443 so native host Nginx can use port 443
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-startupjigawa.com}
      NGINX_ENVSUBST_FILTER: BASE_DOMAIN
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - ./infrastructure/nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'nginx -t' ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth-service
      - www_service
      - academy_service
      - tracker_service
      - portal_service
      - civic_service
      - labs_service
      - products_service
      - cloud_service
      - admin_service
    networks:
      - startup-jigawa-net


networks:
  startup-jigawa-net:
    driver: bridge

volumes:
  db_data:
    driver: local
