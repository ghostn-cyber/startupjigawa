user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker internal DNS resolver for dynamic IP re-resolution
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Common configurations (Upstreams, Headers, Global Error Interception)
    include /etc/nginx/conf.d/00-common.conf;

    # Active Subdomain Virtual Host Symlinks
    include /etc/nginx/conf.d/vhost.www.conf;
    include /etc/nginx/conf.d/vhost.auth.conf;
    include /etc/nginx/conf.d/vhost.academy.conf;
    include /etc/nginx/conf.d/vhost.tracker.conf;
    include /etc/nginx/conf.d/vhost.portal.conf;
    include /etc/nginx/conf.d/vhost.civic.conf;
    include /etc/nginx/conf.d/vhost.labs.conf;
    include /etc/nginx/conf.d/vhost.products.conf;
    include /etc/nginx/conf.d/vhost.admin.conf;
}
