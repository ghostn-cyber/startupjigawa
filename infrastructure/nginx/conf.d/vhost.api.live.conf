server {
    listen 80;
    server_name api.startupjigawa.com;

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /health {
        proxy_pass http://api-service:4100/health;
    }

    location ^~ /api/v1/auth/ {
        proxy_pass http://auth-service:4000;
    }
    location = /api/v1/auth {
        proxy_pass http://auth-service:4000;
    }
    location ^~ /api/v1/ussd/ {
        proxy_pass http://auth-service:4000;
    }
    location ^~ /api/v1/sessions {
        proxy_pass http://auth-service:4000;
    }
    location ^~ /api/v1/dashboard/ {
        proxy_pass http://auth-service:4000;
    }
    location ^~ /oauth/v2/ {
        proxy_pass http://auth-service:4000;
    }
    location ^~ /saml/v2/ {
        proxy_pass http://auth-service:4000;
    }

    location ^~ /api/ {
        proxy_pass http://api-service:4100;
    }

    location / {
        return 404;
    }
}
