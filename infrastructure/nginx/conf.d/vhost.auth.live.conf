server {
    listen 80;
    server_name auth.startupjigawa.com;

    location / {
        proxy_pass http://auth-service:4000;
    }

    location = /logo.jpeg {
        root /usr/share/nginx/html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
