server {
    listen 80;
    server_name startupjigawa.com www.startupjigawa.com;

    location / {
        proxy_pass http://www_service:3001;
    }

    location = /logo.jpeg {
        root /usr/share/nginx/html;
    }

    location = /assets/logo.jpeg {
        alias /usr/share/nginx/html/logo.jpeg;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
