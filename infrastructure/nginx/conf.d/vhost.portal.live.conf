server {
    listen 80;
    server_name portal.startupjigawa.com;

    location / {
        proxy_pass http://portal_service:3004;
    }

    location = /logo.jpeg {
        root /usr/share/nginx/html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
