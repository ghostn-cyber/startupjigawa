server {
    listen 80;
    server_name labs.startupjigawa.com;

    location / {
        proxy_pass http://labs_service:3006;
    }

    location = /logo.jpeg {
        root /usr/share/nginx/html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
