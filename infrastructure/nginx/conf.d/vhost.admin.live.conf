server {
    listen 80;
    server_name admin.startupjigawa.com;

    location / {
        proxy_pass http://admin_service:3009;
    }

    location = /logo.jpeg {
        root /usr/share/nginx/html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
