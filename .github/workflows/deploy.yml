name: CI/CD Pipeline (Docker Hub & VPS)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Service Image
        run: |
          echo "Building Docker image for auth-service..."
          docker build -f apps/auth-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} .
          
          echo "Pushing images to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

      - name: Deploy toVPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "Preparing deployment directory..."
            sudo mkdir -p /var/www/acons
            sudo chown -R $USER:$USER /var/www/acons
            cd /var/www/acons
            
            echo "Exporting environment variables..."
            export DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
            export TAG=${{ github.sha }}
            
            echo "Pulling latest images..."
            docker compose pull
            
            echo "Restarting services..."
            docker compose up -d --remove-orphans
            
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Deployment completed successfully!"