name: CI/CD Pipeline (Docker Hub & VPS)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Service Image
        run: |
          echo "Building Docker image for auth-service..."
          docker build -f apps/auth-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} .
          
          echo "Pushing images to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

      - name: Copy Deployment Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Makefile,docker-compose.yml,infrastructure"
          target: "/var/www/acons"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/acons
            
            echo "Ensuring build tools (make) are installed on VPS..."
            sudo apt-get update && sudo apt-get install -y make
            
            echo "Stopping conflicting native host web services on port 80/443..."
            sudo systemctl stop nginx 2>/dev/null || true
            sudo systemctl disable nginx 2>/dev/null || true
            sudo systemctl stop apache2 2>/dev/null || true
            
            echo "Writing environment variables to .env..."
            echo "DOCKER_USER=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "TAG=${{ github.sha }}" >> .env
            
            echo "Executing production deployment via Makefile..."
            make prod-deploy
            
            echo "Cleaning up old unused images..."
            docker image prune -f
            echo "Deployment completed successfully!"