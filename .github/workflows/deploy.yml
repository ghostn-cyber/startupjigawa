name: CI/CD Pipeline (Docker Hub & VPS)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Auth Service Image
        run: |
          echo "Building Docker image for auth-service..."
          docker build -f apps/auth-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }} .
          
          echo "Pushing auth-service images to Docker Hub..."
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

      - name: Copy Deployment Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "Makefile,docker-compose.yml,docker-compose.dev.yml,Dockerfile.app,infrastructure,apps,packages,package.json,pnpm-workspace.yaml,tsconfig.json,pnpm-lock.yaml"
          target: "/var/www/startupjigawa"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/startupjigawa
            
            echo "Ensuring build tools (make) are installed on VPS..."
            sudo apt-get update && sudo apt-get install -y make
            
            echo "Checking if pnpm is installed..."
            if ! command -v pnpm &> /dev/null; then
                echo "pnpm not found. Installing pnpm globally..."
                sudo npm install -g pnpm || npm install -g pnpm
            else
                echo "pnpm is already installed ($(pnpm --version)). Skipping installation."
            fi
            
            echo "Writing environment variables to .env..."
            echo "DOCKER_USER=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "TAG=${{ github.sha }}" >> .env
            echo "BASE_DOMAIN=startupjigawa.com" >> .env
            
            echo "Executing production deployment via Makefile..."
            make switch-to-com
            make prod-deploy
            make restore-all
            docker compose ps
            
            echo "Cleaning up old unused images..."
            docker image prune -f
            echo "Deployment completed successfully!"